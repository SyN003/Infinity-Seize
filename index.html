button:disabled{opacity:.4}
.c{max-width:420px;margin:12vh auto;padding:20px;display:grid;gap:14px;text-align:center}

#top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
#use{background:var(--gold);color:#111;font-weight:700}
#bars{display:grid;grid-template-columns:auto 120px;gap:2px 6px;font-size:13px;align-items:center}
i.b{display:block;height:10px;background:#0006;border-radius:5px;overflow:hidden}i.b b{display:block;height:100%;background:var(--gem)}
#hpb{background:#ef4444}#stb{background:#22c55e}
canvas{width:100%;display:block;border:2px solid var(--ln);border-radius:8px;background:#000}
#pad{display:flex;justify-content:space-between;align-items:center;margin-top:10px}
#dp{display:grid;grid-template-columns:repeat(3,56px);grid-template-rows:repeat(3,56px);gap:4px}
#dp button,#ac button{padding:0;font-size:22px}#ac{display:flex;gap:8px}#ac button{width:76px;height:76px;font-size:15px}
#lob{margin-top:10px;background:var(--pn);border:2px solid var(--ln);border-radius:10px;padding:12px;display:grid;gap:10px}
.pl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.dot{width:16px;height:16px;border-radius:50%;border:2px solid #fff8;display:inline-block}
#cols button{width:30px;height:30px;padding:0;border-radius:50%}
#hg{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:5px;max-height:190px;overflow:auto}
#hg button{padding:4px;font-size:13px;text-align:left}
.card{border:2px solid var(--gem);border-radius:10px;padding:10px;background:#0b1020;display:grid;gap:3px}
.card h3{margin:0;font-size:22px}.row{display:grid;grid-template-columns:130px 1fr 30px;gap:6px;align-items:center;font-size:14px}
#hpb{background:#ef4444}#enb{background:#38bdf8}#ulb{background:var(--gold)}#sk,#dl,#em{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;align-items:center}#sk button{flex:1;min-width:90px;padding:12px 6px}#dl{font-size:20px}#dl button{flex:1;padding:14px 8px}
#info{font-size:20px;color:var(--gold);text-align:center;flex:1}
</style></head><body>

  <div id="ac"><button data-a="atk">Attack<br>(Z)</button><button data-a="dg">Dodge<br>(X)</button><button data-a="df">Defend<br>(C)</button></div>
 </div>
 <div id="em"><button data-m="Behind you!">Behind you!</button><button data-m="Help!">Help!</button><button data-m="GG">GG</button></div>
 <div id="lob"></div>

Frieza|Dragon Ball Z|Death Beam|90,60,90,50,85`.split('\n').map((l,i)=>{const[n,u,p,s]=l.split('|'),v=s.split(',').map(Number);return{i,n,u,p,s:v,r:v[1]>=90||v[3]>=95}});
const ST=['Physical Power','Magical Power','Speed','Technical Power','Strength & Stamina'];
const COL=['#ef4444','#f97316','#eab308','#22c55e','#06b6d4','#3b82f6','#8b5cf6','#ec4899','#ffffff','#14b8a6','#a3e635','#78350f'];
const W=20,G=16,C=40,$=id=>document.getElementById(id);
const hm=(x,y)=>x<7&&y>=11, sf=(x,y)=>{const g=(S&&S.gz)||[15,0];return x>=g[0]&&x<g[0]+5&&y>=g[1]&&y<g[1]+5};
let ch,host=false,S=null,code='',sel=0,held=null,tk=0,nm='';
const me=sessionStorage.sis_me||(sessionStorage.sis_me=Math.random().toString(36).slice(2,8));
const val=o=>Object.values(o);
function err(t){$('er').textContent=t}
function open_(){$('home').hidden=true;$('main').hidden=false}
function conn(cb){sessionStorage.sis_room=JSON.stringify({code,host});
 ch=sb.channel('sis-'+code,{config:{broadcast:{self:false}}});
 ch.on('broadcast',{event:'s'},({payload})=>{if(!host){S=payload;ui()}});
 ch.on('broadcast',{event:'a'},({payload})=>{if(host)hd(payload)});
 ch.subscribe(s=>{if(s==='SUBSCRIBED')cb()});
}
function mk(){
 nm=$('nm').value.trim()||'Hero';host=true;
 code=Array.from({length:6},()=>'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[Math.random()*32|0]).join('');
 S={ph:'lobby',n:+$('np').value,pl:{},cr:[],tr:[],fx:[],fl:[],pu:[],du:null,map:+$('mpS').value,pt:[],wl:[],gz:[15,0],tl:0,win:'',msg:'',host:me,code};
 conn(()=>{hd({t:'join',id:me,nm});open_()});
}
function jn(){
 nm=$('nm').value.trim()||'Hero';code=$('cd').value.trim().toUpperCase();
 if(code.length!=6)return err('Enter the 6-character code.');
 conn(()=>{const t=setInterval(()=>{if(S){clearInterval(t);open_()}else tx('join',{nm})},800);tx('join',{nm});
  setTimeout(()=>{if(!S)err('Lobby not found or already full.')},5000)});
}
function tx(t,o={}){o.t=t;o.id=me;host?hd(o):ch.send({type:'broadcast',event:'a',payload:o})}
function bc(){ch.send({type:'broadcast',event:'s',payload:S});if(host)try{sessionStorage.sis_S=JSON.stringify(S)}catch(e){}ui()}
function ok(x,y,p){return x>=0&&y>=0&&x<W&&y<G&&!hm(x,y)&&!sf(x,y)&&!val(S.pl).some(q=>q!=p&&q.x==x&&q.y==y)}
function add(id,nm){
 const i=Object.keys(S.pl).length,a=S.n<=3?1:2;
 S.pl[id]={id,nm,col:'',role:i<a?'A':'D',h:[],x:i<a?i:-1,y:i<a?G-1:-1,alive:1,hp:100,mhp:100,st:100,c:{},fx:0,fy:-1,en:50,ul:0,cap:0};
}
function hd(m){
 let p=S.pl[m.id];
 if(m.t=='join'){if(S.ph=='lobby'&&!p&&Object.keys(S.pl).length<S.n)add(m.id,(m.nm||'Hero').slice(0,12))}
 else if(!p)return;
 else if(m.t=='em')S.em={id:m.id,m:String(m.m).slice(0,14),t:60};
 else if(S.ph=='lobby'){
  if(m.t=='col'&&COL.includes(m.c)&&!val(S.pl).some(q=>q.col==m.c))p.col=m.c;
  if(m.t=='pick'){const i=p.h.indexOf(m.i);
   if(i>=0)p.h.splice(i,1);
   else if(p.h.length<(p.role=='A'?3:2)&&!val(S.pl).some(q=>q.h.includes(m.i)))p.h.push(m.i)}
  if(m.t=='pos'&&p.role=='D'){
   if(!m.k||m.k=='s'){if(ok(m.x,m.y,p)){p.x=m.x;p.y=m.y}}
   else{const mine=S.pt.filter(t=>t.o==p.id),i=S.pt.findIndex(t=>t.x==m.x&&t.y==m.y&&t.o==p.id);
    if(i>=0)S.pt.splice(i,1);
    else if(mine.length<5&&(m.k!='w'||mine.filter(t=>t.k=='w').length<2)&&ok(m.x,m.y,p)&&!(m.x<=7&&m.y>=10)&&m.x+m.y>0&&!(m.x==W-1&&m.y==G-1)&&!S.pt.some(t=>t.x==m.x&&t.y==m.y)&&!val(S.pl).some(q=>q.x==m.x&&q.y==m.y))S.pt.push({x:m.x,y:m.y,k:m.k=='w'?'w':'t',o:p.id})}}
  if(m.t=='map'&&m.id==S.host&&MAPS[m.i])S.map=m.i;
  if(m.t=='go'&&m.id==S.host)start();
 }else if(S.ph=='end'){if(m.t=='again'&&m.id==S.host)again()}
 else if(S.ph=='play'&&p.alive){
  if(S.du&&inD(p)){if(m.t=='card'){const k=S.du.a==p.id?'pa':'pb';if(S.du[k]<0)S.du[k]=m.c|0}}
  else{
   if(m.t=='mv')mv(p,m.d[0],m.d[1]);
   if(m.t=='atk')atk(p);
   if(m.t=='dg'&&!p.c.dd){p.c.dg=10;p.c.dd=50}
   if(m.t=='df'&&!p.c.f){p.c.df=20;p.c.f=40}
   if(m.t=='sk')sk(p,m.i);
   if(m.t=='ult'&&p.ul>=100){p.ul=0;bl(p,4,4);snd('k')}
   if(m.t=='use'){if(p.x==0&&p.y==0)p.c.t=120;if(p.x==W-1&&p.y==G-1)p.c.e=120}
  }
 }
 if(S.ph!='play')bc();
}
const MAPS=[{n:'Wakanda',c:['#13271d','#0f1e17'],t:'Vibranium Spikes',k:0,v:15},{n:'Hidden Leaf Village',c:['#2b2513','#211c0f'],t:'Explosive Tag',k:0,v:22},{n:'Hall of Justice',c:['#1a2147','#141a38'],t:'Kryptonite (drains stamina)',k:1,v:12},{n:'Capsule Corp',c:['#3a1a2a','#2c1320'],t:'Gravity Chamber (slows)',k:2,v:60}];
const skT=h=>h.r?'proj':h.s[2]>=90?'dash':h.s[0]>=90?'blast':h.s[4]>=85?'shield':h.s[3]>=70?'stealth':'buff';
const CN=['Strike','Guard','Special','Combo'],PU=['⚡','🛡️','💚','👻'];
const inD=p=>S.du&&(S.du.a==p.id||S.du.b==p.id);
const dist=(a,b)=>Math.max(Math.abs(a.x-b.x),Math.abs(a.y-b.y));
const prot=(p,q)=>!(p.role=='D'&&(hm(q.x,q.y)||(sf(q.x,q.y)&&!p.r)));
const foes=p=>val(S.pl).filter(q=>q.alive&&q.role!=p.role&&prot(p,q));
const snd=t=>{S.sn=(S.sn||0)+1;S.sk=t};
const fl=(q,v,c)=>S.fl.push({x:q.x,y:q.y,v,c:c||'#fff',t:20});
function syn(hs){const o={dm:1,mv:0,hp:1,t:[]};
 if(hs.filter(i=>H[i].s[2]>=90).length>=2){o.mv=1;o.t.push('Blitz')}
 if([[31,32],[38,39],[12,13],[0,1]].some(r=>r.every(i=>hs.includes(i)))){o.dm=1.2;o.t.push('Rivals')}
 if(hs.length>1&&new Set(hs.map(i=>H[i].u)).size==1){o.hp=1.1;o.t.push('Team-Up')}
 return o}
function start(){
 const P=val(S.pl);
 if(P.length<S.n||P.some(p=>!p.col||p.h.length<(p.role=='A'?3:2)||p.x<0)){S.msg='Waiting: all '+S.n+' players need a color, full hero picks, and defenders need a spawn tile.';return}
 P.forEach(p=>{const s=[0,0,0,0,0],y=syn(p.h);p.h.forEach(i=>H[i].s.forEach((v,k)=>s[k]+=v));
  p.r=p.h.some(i=>H[i].r);p.mhp=(100+s[4]*.6)*y.hp;p.hp=p.mhp;p.dm=(5+(s[0]+s[1]+s[3])/30)*y.dm;
  p.mv=Math.max(2,Math.round(8-s[2]/45)-y.mv);p.st=100;p.alive=1;p.steps=0;p.en=50;p.ul=0;p.cap=0;p.fx=0;p.fy=-1;p.sy=y.t.join('+');p.c={}});
 const free=()=>{let x,y;do{x=Math.random()*W|0;y=Math.random()*G|0}while(hm(x,y)||sf(x,y)||(x+y==0)||(x==0&&y==G-1)||P.some(p=>p.x==x&&p.y==y)||S.pt.some(t=>t.x==x&&t.y==y));return{x,y}};
 S.cr=[1,1,1,2,2,3].map(z=>({...free(),a:1,z,hp:z}));
 S.wl=S.pt.filter(t=>t.k=='w');S.tr=S.pt.filter(t=>t.k=='t');if(!S.tr.length)S.tr=Array.from({length:6},free);S.pu=[];S.fx=[];S.fl=[];S.du=null;S.tl=9600;S.gz=[15,0];S.ph='play';S.msg='';
}
function again(){
 const P=val(S.pl),a=S.n<=3?1:2,o={};
 P.slice(a).concat(P.slice(0,a)).forEach((p,i)=>{p.role=i<a?'A':'D';p.h=[];p.x=i<a?i:-1;p.y=i<a?G-1:-1;p.alive=1;o[p.id]=p});
 S.pl=o;S.pt=[];S.ph='lobby';S.win='';S.du=null;S.msg='Roles swapped. Pick new heroes.';
}
const cm=(p,x,y)=>x>=0&&y>=0&&x<W&&y<G&&!(p.role=='D'&&(hm(x,y)||sf(x,y)))&&!val(S.pl).some(q=>q!=p&&q.alive&&q.x==x&&q.y==y)&&!S.wl.some(w=>w.x==x&&w.y==y);
function mv(p,dx,dy){
 if(Math.abs(dx)+Math.abs(dy)!=1)return;p.fx=dx;p.fy=dy;
 if(p.c.m>0||(p.role=='A'&&p.st<=0))return;
 const x=p.x+dx,y=p.y+dy;if(cm(p,x,y))stp(p,x,y);
}
function stp(p,x,y){
 p.x=x;p.y=y;p.c.m=Math.max(2,p.mv-(p.c.sp>0?2:0)+(p.c.sl>0?3:0));
 const u=S.pu.findIndex(u=>u.x==x&&u.y==y);
 if(u>=0){const k=S.pu.splice(u,1)[0].k;if(k==0)p.c.sp=100;if(k==1)p.c.df=100;if(k==2)p.hp=Math.min(p.mhp,p.hp+p.mhp*.25);if(k==3)p.c.iv=100;fl(p,PU[k])}
 if(p.role=='A'){
  if(++p.steps%3==0)p.st=Math.max(0,p.st-1);
  const t=S.tr.findIndex(t=>t.x==x&&t.y==y);
  if(t>=0){S.tr.splice(t,1);const T=MAPS[S.map];
   if(T.k==0){p.hp-=T.v;fl(p,'-'+T.v,'#fb923c');if(p.hp<=0){p.hp=0;p.alive=0}}
   else if(T.k==1){p.st=Math.max(0,p.st-T.v);fl(p,'-'+T.v+' ST','#fb923c')}
   else p.c.sl=T.v;
   snd('h')}
 }
}
function hit(p,q,m,raw){
 if(!q.role){q.hp--;fl(q,'💥');snd('h');if(q.hp<=0){q.a=0;const z=q.z;
  if(p.role=='A')p.st=Math.min(100,p.st+.4*z);
  else{p.mhp*=1+.002*z;p.hp=Math.min(p.mhp,p.hp+p.mhp*.002*z);p.dm*=1+.002*z}
  if(Math.random()<.25*z)S.pu.push({x:q.x,y:q.y,k:Math.random()*4|0})}
  return}
 let d=p.dm*m*(p.c.bf>0?1.5:1);
 if(!raw){if(q.c.dg>0){q.c.dg=0;fl(q,'Dodge!','#9ca3af');snd('b');return}if(q.c.df>0){d*=.4;snd('b')}}
 d=Math.round(d);q.hp-=d;q.c.hf=3;S.sh=4;fl(q,'-'+d,'#fca5a5');snd('h');
 p.ul=Math.min(100,p.ul+8);q.ul=Math.min(100,q.ul+5);
 if(q.hp<=0){q.hp=0;q.alive=0}
}
function bl(p,r,m){
 foes(p).filter(q=>dist(p,q)<=r).forEach(q=>hit(p,q,m));
 S.cr.filter(c=>c.a&&dist(p,c)<=r).forEach(c=>hit(p,c,m));

}
function sk(p,i){
 const h=H[p.h[i]];if(!h||p.c['s'+i]>0||p.en<25)return;
 const t=skT(h);p.en-=25;p.c['s'+i]=120;snd('k');
 if(t=='proj'){let x=p.x,y=p.y;
  for(let k=0;k<8;k++){const nx=x+p.fx,ny=y+p.fy;if(nx<0||ny<0||nx>=W||ny>=G)break;x=nx;y=ny;
   const q=foes(p).find(q=>q.x==x&&q.y==y)||S.cr.find(c=>c.a&&c.x==x&&c.y==y);if(q){hit(p,q,1.8);break}}
  S.fx.push({a:[p.x,p.y],b:[x,y],c:p.col,t:5})}
 else if(t=='dash'){for(let k=0;k<4;k++){const x=p.x+p.fx,y=p.y+p.fy;if(!cm(p,x,y))break;stp(p,x,y)}}
 else if(t=='blast')bl(p,2,1.6);
 else if(t=='shield'){p.c.df=80;p.hp=Math.min(p.mhp,p.hp+p.mhp*.1)}

function atk(p){
 if(p.c.a>0)return;
 const n=foes(p).find(q=>dist(p,q)<=1&&!inD(q));
 if(n){S.du={a:p.id,b:n.id,pa:-1,pb:-1,t:160};return}
 p.c.a=14;const R=p.r?6:3;let best=null,bd=99;
 for(const q of[...foes(p),...S.cr.filter(c=>c.a)]){const d=dist(p,q);if(d<=R&&d<bd){best=q;bd=d}}
 if(!best)return;
 S.fx.push({a:[p.x,p.y],b:[best.x,best.y],c:p.col,t:4});hit(p,best,1);
}
function pickC(p,c){
 if(c<0)c=Math.random()*3|0;
 if(c==2&&p.en<25)c=0;if(c==3&&p.ul<40)c=0;

function resolve(){

 if(w(x,y))hit(a,b,M[x],1);else if(w(y,x))hit(b,a,M[y],1);
 else if(!(x==1&&y==1)){hit(a,b,.5,1);hit(b,a,.5,1)}
 S.msg=a.nm+': '+CN[x]+' vs '+b.nm+': '+CN[y];S.mt=60;a.c.a=b.c.a=20;
}

 }

function lobby(mp){
 const a=S.n<=3?1:2,tkn={};val(S.pl).forEach(q=>q.h.forEach(i=>tkn[i]=q));
 const h=H[sel],can=mp&&mp.h.length<(mp.role=='A'?3:2),mine=mp&&mp.h.includes(h.i);

 <div id="hg">${H.map(x=>`<button onclick="sel=${x.i};ui()" style="${x.i==sel?'border-color:var(--gem)':''}">${tkn[x.i]?`<span class="dot" style="background:${tkn[x.i].col||'#888'};width:10px;height:10px"></span> `:''}${x.n}</button>`).join('')}</div>
 <div class="card"><h3>${h.n}</h3><small>${h.u} · Skill: ${h.p} (${skT(h)})${h.r?' · Ranged (6 tiles)':''}</small>
 ${ST.map((s,k)=>`<div class="row">${s}<i class="b"><b style="width:${h.s[k]}%"></b></i>${h.s[k]}</div>`).join('')}
 <button onclick="tx('pick',{i:${h.i}})" ${!mine&&(tkn[h.i]||!can)?'disabled':''}>${mine?'Drop hero':tkn[h.i]?'Taken':'Pick hero'}</button></div>
 ${me==S.host?`<button onclick="tx('go')">Start match</button>`:'<div>Waiting for the host to start…</div>'}<div style="color:#f87171">${S.msg||''}</div>`;

function draw(){
 if(!S)return;const c=$('cv').getContext('2d'),mp=S.pl[me],M=MAPS[S.map||0];
 c.save();if(S.sh>0)c.translate(Math.random()*8-4,Math.random()*8-4);
 for(let x=0;x<W;x++)for(let y=0;y<G;y++){c.fillStyle=hm(x,y)?'#1e40af':sf(x,y)?'#854d0e':(x+y)%2?M.c[0]:M.c[1];c.fillRect(x*C,y*C,C,C)}
 c.textAlign='center';c.textBaseline='middle';c.font='26px serif';
 c.fillText('🌳',20,18);c.fillText('⭐',W*C-20,G*C-22);c.fillText('💎',(S.gz[0]+4)*C+20,S.gz[1]*C+20);
 c.font='700 9px sans-serif';c.fillStyle='#fff';c.fillText('Hidden Trap',20,36);c.fillText('See Enemy',W*C-20,G*C-6);
 c.fillText('ATTACKER HOME',140,G*C-6);c.fillText('GEM SAFE ZONE',(S.gz[0]+2.5)*C,S.gz[1]*C+6);c.fillText(M.n,400,6);
 S.cr.forEach(r=>{if(r.a){c.font=(14+r.z*6)+'px serif';c.fillText('👾',r.x*C+20,r.y*C+22)}});
 c.font='22px serif';S.pu.forEach(u=>c.fillText(PU[u.k],u.x*C+20,u.y*C+22));
 if(S.ph=='lobby'){if(mp&&mp.role=='D')S.pt.forEach(t=>c.fillText(t.k=='w'?'🧱':'🕳️',t.x*C+20,t.y*C+22))}else S.wl.forEach(w=>c.fillText('🧱',w.x*C+20,w.y*C+22));
 if(mp&&mp.c&&mp.c.t>0)S.tr.forEach(t=>c.fillText('🕳️',t.x*C+20,t.y*C+22));
 S.fx.forEach(f=>{c.strokeStyle=f.c||'#fff';c.lineWidth=4;c.beginPath();
  if(f.r)c.arc(f.a[0]*C+20,f.a[1]*C+20,f.r*C+20,0,7);else{c.moveTo(f.a[0]*C+20,f.a[1]*C+20);c.lineTo(f.b[0]*C+20,f.b[1]*C+20)}c.stroke()});
 val(S.pl).forEach(q=>{

  c.lineWidth=q.id==me?4:2;c.strokeStyle=q.role=='A'?'#f5c542':'#60a5fa';c.stroke();

  if(S.ph!='lobby'){c.fillStyle='#000a';c.fillRect(cx-14,cy-20,28,4);c.fillStyle='#ef4444';c.fillRect(cx-14,cy-20,28*q.hp/q.mhp,4)}
  c.globalAlpha=1});
 c.font='700 15px sans-serif';S.fl.forEach(f=>{c.fillStyle=f.c;c.fillText(f.v,f.x*C+20,f.y*C-(20-f.t))});
 if(S.du){const a=S.pl[S.du.a],b=S.pl[S.du.b];c.font='24px serif';c.fillText('⚔️',(a.x+b.x)*C/2+20,(a.y+b.y)*C/2+20)}
 if(S.em){const q=S.pl[S.em.id];if(q){c.font='700 12px sans-serif';c.fillStyle='#fff';c.fillText(S.em.m,q.x*C+20,q.y*C-12)}}
 c.restore();
}
